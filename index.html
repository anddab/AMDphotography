<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMD Photography - Fine Art Portfolio</title>
  
  <!-- Font Google Elegant per titoli Fine Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #18181c;
      --text: #f1f1f5;
      --text-muted: #9e9ea7;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
      --border: #2a2a32;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-heading: 'Cormorant Garamond', serif;
    }

    [data-theme="light"] {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6c757d;
      --accent: #c59b27;
      --accent-hover: #a37f1e;
      --border: #e9ecef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      line-height: 1.6;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      letter-spacing: 0.5px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    [data-theme="light"] header {
      background: rgba(248, 249, 250, 0.85);
    }

    /* LOGO */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
      height: 130px;
      width: 130px;
      flex-shrink: 0;
    }

    .site-logo {
      height: 100%;
      width: 100%;
      display: block;
      object-fit: contain;
      transition: opacity 0.4s ease-in-out;
    }

    .logo-light {
      opacity: 1;
    }

    .logo-dark {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    [data-theme="light"] .logo-light {
      opacity: 0;
    }

    [data-theme="light"] .logo-dark {
      opacity: 1;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.3s, color 0.3s;
      white-space: nowrap;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      min-height: 38px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
      text-transform: capitalize;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* GALLERIA */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
    }

    .photo-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      aspect-ratio: 4 / 3;
    }

    .photo-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      opacity: 0;
      filter: blur(8px);
      transition: opacity 0.6s ease, filter 0.6s ease;
    }

    .photo-card img.loaded {
      opacity: 1;
      filter: blur(0);
    }

    .photo-info-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
    }

    .photo-info-overlay h4 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .photo-card:hover .photo-info-overlay {
      opacity: 1;
    }

    /* MODALE LIGHTBOX */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-container {
      max-width: 1100px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 92vh;
      position: relative;
    }

    .modal-viewport {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 380px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .modal-viewport img {
      max-height: 60vh;
      max-width: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-viewport:fullscreen img,
    .modal-viewport:-webkit-full-screen img {
      max-height: 90vh;
    }

    .photo-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .slide-counter {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 0.3rem 0.8rem;
      border-radius: 15px;
      font-size: 0.8rem;
      z-index: 30;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-top-actions {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      z-index: 30;
    }

    .viewport-fullscreen-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 30;
      display: none !important;
    }

    .modal-viewport:fullscreen .viewport-fullscreen-btn,
    .modal-viewport:-webkit-full-screen .viewport-fullscreen-btn {
      display: flex !important;
    }

    .modal-action-btn {
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s, transform 0.2s;
    }

    .modal-action-btn:hover {
      background: rgba(0,0,0,0.9);
      transform: scale(1.05);
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .carousel-btn:hover {
      background: rgba(0,0,0,0.9);
    }

    .carousel-btn.prev { left: 1rem; }
    .carousel-btn.next { right: 1rem; }

    .thumbnails-bar {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }

    .thumb-item {
      width: 54px;
      height: 54px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.5;
      transition: opacity 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-item:hover {
      opacity: 0.85;
    }

    .thumb-item.active {
      opacity: 1;
      border-color: var(--accent);
    }

    .modal-details {
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .modal-details h3 {
      font-size: 1.5rem;
    }

    .buy-btn {
      background: var(--accent);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .page-section { display: none; }
    .page-section.active { display: block; }

    .about-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 3rem;
      align-items: start;
    }

    .about-container h2 {
      font-size: 2.2rem;
    }

    .loading-msg {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    /* MEDIA QUERY PER DISPOSITIVI MOBILI (ADATTAMENTO LOGO E MENU) */
    @media (max-width: 768px) {
      header {
        padding: 0.5rem 1rem;
        gap: 0.8rem;
        justify-content: space-between;
      }

      .logo-container {
        height: 65px;
        width: 65px;
      }

      .nav-links {
        gap: 0.8rem;
      }

      .nav-btn {
        font-size: 0.85rem;
      }

      .theme-toggle {
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
      }

      .about-container { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: 1fr; }
      .carousel-btn { width: 36px; height: 36px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container" onclick="switchPage('gallery')">
      <img src="AMDphotoLOGO-light.png" alt="AMD Photography Logo" class="site-logo logo-light">
      <img src="AMDphotoLOGO-dark.png" alt="AMD Photography Logo" class="site-logo logo-dark">
    </div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchPage('gallery')">Galleria</button>
      <button class="nav-btn" onclick="switchPage('about')">Chi Sono</button>
      <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
    </div>
  </header>

  <main>
    <section id="gallery-section" class="page-section active">
      <div class="filters" id="categoryFilters"></div>
      <div class="gallery-grid" id="galleryGrid">
        <div class="loading-msg">Caricamento fotografie in corso...</div>
      </div>
    </section>

    <section id="about-section" class="page-section">
      <div class="about-container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Fotografo" style="width:100%; border-radius:8px;">
        <div>
          <h2>Chi Sono</h2>
          <p style="margin-top: 1rem; color: var(--text-muted);">
            Benvenuto nel mio portfolio. Sono un fotografo specializzato in reportage di paesaggio ed arte visiva.
            Ogni scatto è disponibile come stampa d'arte in edizione limitata.
          </p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="photoModal">
    <div class="modal-container">
      
      <div class="modal-top-actions">
        <button class="modal-action-btn" id="btnFullscreen" onclick="toggleFullscreen()" title="A tutto schermo">⛶</button>
        <button class="modal-action-btn" onclick="closeModal()" title="Chiudi">✕</button>
      </div>

      <div class="modal-viewport" id="modalViewport">
        <div class="slide-counter" id="slideCounter">1 / 1</div>
        <div class="photo-shield" oncontextmenu="return false;"></div>
        
        <button class="modal-action-btn viewport-fullscreen-btn" onclick="toggleFullscreen()" title="Esci da tutto schermo">✕</button>
        
        <button class="carousel-btn prev" id="btnPrev" onclick="changeSlide(-1)">❮</button>
        <img id="modalImg" src="" alt="Foto principale">
        <button class="carousel-btn next" id="btnNext" onclick="changeSlide(1)">❯</button>
      </div>

      <div class="thumbnails-bar" id="thumbnailsBar"></div>

      <div class="modal-details">
        <div>
          <h3 id="modalTitle">Titolo Foto</h3>
          <p id="modalExif" style="color: var(--text-muted); font-size: 0.85rem;">Dettagli EXIF</p>
        </div>
        <a id="modalBuyLink" href="#" target="_blank" class="buy-btn">Acquista Stampa d'Arte</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());

    const GITHUB_USER = "anddab";
    const GITHUB_REPO = "AMDPhotography";
    const BRANCH = "main";

    let loadedPhotos = [];
    let currentPhoto = null;
    let currentSlideIndex = 0;
    let currentFilter = 'all';

    let touchStartX = 0;
    let touchEndX = 0;

    function cleanImgUrl(url) {
      if (!url) return '';
      if (url.startsWith('http://') || url.startsWith('https://')) return url;
      return url.startsWith('/') ? url.slice(1) : url;
    }

    function parseFrontmatter(text) {
      const result = { views: [] };
      const lines = text.split('\n');
      let inFrontmatter = false;
      let inMockups = false;

      lines.forEach(line => {
        const trimmed = line.trim();

        if (trimmed === '---') {
          inFrontmatter = !inFrontmatter;
          return;
        }

        if (inFrontmatter) {
          if (trimmed.startsWith('mockups:')) {
            inMockups = true;
            return;
          }

          if (inMockups) {
            if (trimmed.startsWith('-')) {
              let val = trimmed
                .replace(/^-\s*/, '')
                .replace(/^mockup:\s*/, '')
                .replace(/^["']|["']$/g, '')
                .trim();

              if (val) {
                const cleaned = cleanImgUrl(val);
                if (!result.views.includes(cleaned)) {
                  result.views.push(cleaned);
                }
              }
              return;
            } else if (trimmed !== '') {
              inMockups = false;
            }
          }

          const colonIndex = trimmed.indexOf(':');
          if (colonIndex !== -1 && !inMockups) {
            const key = trimmed.slice(0, colonIndex).trim();
            let val = trimmed.slice(colonIndex + 1).trim().replace(/^["']|["']$/g, '');
            if (key && key !== 'mockups') {
              result[key] = val;
            }
          }
        }
      });

      if (result.image) {
        const mainClean = cleanImgUrl(result.image);
        result.views = result.views.filter(v => v !== mainClean);
        result.views.unshift(mainClean);
      }

      return result;
    }

    async function loadCMSPhotos() {
      const grid = document.getElementById('galleryGrid');
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/content/photos?ref=${BRANCH}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Impossibile accedere alla cartella delle foto');

        const files = await response.json();
        const photoPromises = files
          .filter(file => file.name.endsWith('.md') || file.name.endsWith('.markdown'))
          .map(async file => {
            const res = await fetch(file.download_url);
            const content = await res.text();
            return parseFrontmatter(content);
          });

        loadedPhotos = await Promise.all(photoPromises);

        if (loadedPhotos.length === 0) {
          grid.innerHTML = '<div class="loading-msg">Nessuna fotografia trovata. Aggiungine una dal tuo pannello /admin!</div>';
        } else {
          buildDynamicFilters();
          renderGallery('all');
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="loading-msg">Errore nel caricamento delle fotografie dal CMS.</div>';
      }
    }

    function buildDynamicFilters() {
      const filterContainer = document.getElementById('categoryFilters');
      filterContainer.innerHTML = '';

      const categories = new Set();
      loadedPhotos.forEach(p => {
        if (p.category) {
          categories.add(p.category.trim().toLowerCase());
        }
      });

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = 'Tutte';
      allBtn.onclick = (e) => filterGallery('all', e.target);
      filterContainer.appendChild(allBtn);

      Array.from(categories).sort().forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.onclick = (e) => filterGallery(cat, e.target);
        filterContainer.appendChild(btn);
      });
    }

    function renderGallery(filter = 'all') {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      const filtered = loadedPhotos.filter(photo => {
        if (filter === 'all') return true;
        return photo.category && photo.category.trim().toLowerCase() === filter.toLowerCase();
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading-msg">Nessuna fotografia presente per questa categoria.</div>';
        return;
      }

      filtered.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        const mainImg = photo.views[0] || 'https://via.placeholder.com/800x600';
        
        card.innerHTML = `
          <img src="${mainImg}" alt="${photo.title || 'Fotografia'}" loading="lazy" onload="this.classList.add('loaded')">
          <div class="photo-info-overlay">
            <h4>${photo.title || 'Senza titolo'}</h4>
          </div>
        `;
        card.onclick = () => openModal(photo);
        grid.appendChild(card);
      });
    }

    function filterGallery(cat, targetBtn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (targetBtn) {
        targetBtn.classList.add('active');
      }
      renderGallery(cat);
    }

    function openModal(photo) {
      currentPhoto = photo;
      currentSlideIndex = 0;
      buildThumbnails();
      updateModalView();
      document.getElementById('photoModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('photoModal').classList.remove('active');
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function buildThumbnails() {
      const thumbBar = document.getElementById('thumbnailsBar');
      thumbBar.innerHTML = '';

      const views = (currentPhoto.views && currentPhoto.views.length > 0) ? currentPhoto.views : [];
      if (views.length <= 1) {
        thumbBar.style.display = 'none';
        return;
      }

      thumbBar.style.display = 'flex';
      views.forEach((v, idx) => {
        const item = document.createElement('div');
        item.className = `thumb-item ${idx === 0 ? 'active' : ''}`;
        item.innerHTML = `<img src="${v}" alt="Miniatura ${idx + 1}">`;
        item.onclick = () => {
          currentSlideIndex = idx;
          updateModalView();
        };
        thumbBar.appendChild(item);
      });
    }

    function updateModalView() {
      const views = (currentPhoto.views && currentPhoto.views.length > 0) ? currentPhoto.views : ['https://via.placeholder.com/1200x800'];
      const modalImg = document.getElementById('modalImg');

      modalImg.style.opacity = '0.3';
      setTimeout(() => {
        modalImg.src = views[currentSlideIndex];
        modalImg.style.opacity = '1';
      }, 150);

      document.getElementById('modalTitle').textContent = currentPhoto.title || 'Senza titolo';
      
      const cameraInfo = currentPhoto.camera || '';
      const lensInfo = currentPhoto.lens || '';
      const exifInfo = currentPhoto.exif || '';
      document.getElementById('modalExif').textContent = [cameraInfo, lensInfo, exifInfo].filter(Boolean).join(' | ') || 'AMD Photography';

      const counter = document.getElementById('slideCounter');
      counter.textContent = `${currentSlideIndex + 1} / ${views.length}`;

      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      if (views.length <= 1) {
        btnPrev.style.display = 'none';
        btnNext.style.display = 'none';
      } else {
        btnPrev.style.display = 'block';
        btnNext.style.display = 'block';
      }

      const thumbs = document.querySelectorAll('.thumb-item');
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === currentSlideIndex);
      });

      // NUOVO CODICE (supporta picfair_url e buy_url):
const buyBtn = document.getElementById('modalBuyLink');
const targetUrl = currentPhoto.picfair_url || currentPhoto.buy_url;

if (targetUrl && targetUrl.trim() !== '') {
  buyBtn.href = targetUrl.trim();
  buyBtn.style.display = 'inline-block';
} else {
  buyBtn.style.display = 'none';
}
    }

    function changeSlide(direction) {
      if (!currentPhoto || !currentPhoto.views || currentPhoto.views.length <= 1) return;
      currentSlideIndex = (currentSlideIndex + direction + currentPhoto.views.length) % currentPhoto.views.length;
      updateModalView();
    }

    function toggleFullscreen() {
      const viewport = document.getElementById('modalViewport');
      const isFS = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isFS) {
        if (viewport.requestFullscreen) {
          viewport.requestFullscreen();
        } else if (viewport.webkitRequestFullscreen) {
          viewport.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    const modalViewport = document.getElementById('modalViewport');
    modalViewport.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    modalViewport.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const swipeThreshold = 40;
      if (touchEndX < touchStartX - swipeThreshold) {
        changeSlide(1);
      }
      if (touchEndX > touchStartX + swipeThreshold) {
        changeSlide(-1);
      }
    }

    function switchPage(page) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (page === 'gallery') {
        document.getElementById('gallery-section').classList.add('active');
      } else {
        document.getElementById('about-section').classList.add('active');
      }
      if (event && event.target && event.target.classList.contains('nav-btn')) {
        event.target.classList.add('active');
      }
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('photoModal').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
      if (e.key === 'Escape') closeModal();
    });

    loadCMSPhotos();
  </script>
</body>
</html>
