<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Fotografico - Fine Art Photography</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #18181c;
      --text: #f1f1f5;
      --text-muted: #9e9ea7;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
      --border: #2a2a32;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6c757d;
      --accent: #c59b27;
      --accent-hover: #a37f1e;
      --border: #e9ecef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    [data-theme="light"] header {
      background: rgba(248, 249, 250, 0.85);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .gallery-grid {
      columns: 3 320px;
      column-gap: 1.5rem;
    }

    .photo-card {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    .photo-card img {
      width: 100%;
      display: block;
      pointer-events: none;
    }

    .photo-info-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .photo-card:hover .photo-info-overlay {
      opacity: 1;
    }

    /* MODAL LIGHTBOX */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-container {
      max-width: 1100px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      position: relative;
    }

    .modal-viewport {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      overflow: hidden;
    }

    .modal-viewport img {
      max-height: 65vh;
      max-width: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .photo-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      font-size: 1.2rem;
    }

    .carousel-btn.prev { left: 1rem; }
    .carousel-btn.next { right: 1rem; }

    .modal-details {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .buy-btn {
      background: var(--accent);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30;
    }

    /* ABOUT SECTION */
    .page-section { display: none; }
    .page-section.active { display: block; }

    .about-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .about-container { grid-template-columns: 1fr; }
      .gallery-grid { columns: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Portfolio Fotografico</div>
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchPage('gallery')">Galleria</button>
      <button class="nav-btn" onclick="switchPage('about')">Chi Sono</button>
      <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
    </div>
  </header>

  <main>
    <!-- SEZIONE GALLERIA -->
    <section id="gallery-section" class="page-section active">
      <div class="filters">
        <button class="filter-btn active" onclick="filterGallery('all')">Tutte</button>
        <button class="filter-btn" onclick="filterGallery('paesaggi')">Paesaggi</button>
        <button class="filter-btn" onclick="filterGallery('ritratti')">Ritratti</button>
        <button class="filter-btn" onclick="filterGallery('architettura')">Architettura</button>
      </div>

      <div class="gallery-grid" id="galleryGrid">
        <!-- Foto caricate dinamicamente -->
      </div>
    </section>

    <!-- SEZIONE ABOUT -->
    <section id="about-section" class="page-section">
      <div class="about-container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Fotografo" style="width:100%; border-radius:8px;">
        <div>
          <h2>Chi Sono</h2>
          <p style="margin-top: 1rem; color: var(--text-muted);">
            Benvenuto nel mio portfolio. Sono un fotografo specializzato in reportage di paesaggio ed arte visiva.
            Ogni scatto è disponibile come stampa d'arte in edizione limitata.
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL LIGHTBOX CON PROTEZIONE E MOCKUP CAROSELLO -->
  <div class="modal" id="photoModal">
    <div class="modal-container">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <div class="modal-viewport">
        <div class="photo-shield" oncontextmenu="return false;"></div>
        <button class="carousel-btn prev" onclick="changeSlide(-1)">❮</button>
        <img id="modalImg" src="" alt="Foto principale">
        <button class="carousel-btn next" onclick="changeSlide(1)">❯</button>
      </div>
      <div class="modal-details">
        <div>
          <h3 id="modalTitle">Titolo Foto</h3>
          <p id="modalExif" style="color: var(--text-muted); font-size: 0.85rem;">Dettagli EXIF</p>
        </div>
        <a id="modalBuyLink" href="#" target="_blank" class="buy-btn">Acquista Stampa d'Arte</a>
      </div>
    </div>
  </div>

  <script>
    // Blocco globale tasto destro per proteggere le foto
    document.addEventListener('contextmenu', event => event.preventDefault());

    const photos = [
      {
        id: 1,
        title: "Tramonto sulle Dolomiti",
        category: "paesaggi",
        views: [
          "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80",
          "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=1600&q=80"
        ],
        exif: "Sony A7 IV | 24mm | f/8.0 | ISO 100",
        buyUrl: "https://etsy.com"
      },
      {
        id: 2,
        title: "Geometria Urbana",
        category: "architettura",
        views: [
          "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80"
        ],
        exif: "Canon R5 | 35mm | f/5.6 | ISO 200",
        buyUrl: "https://etsy.com"
      }
    ];

    let currentPhoto = null;
    let currentSlideIndex = 0;

    function renderGallery(filter = 'all') {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';
      photos.forEach(photo => {
        if (filter === 'all' || photo.category === filter) {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <img src="${photo.views[0]}" alt="${photo.title}">
            <div class="photo-info-overlay">
              <h4>${photo.title}</h4>
            </div>
          `;
          card.onclick = () => openModal(photo);
          grid.appendChild(card);
        }
      });
    }

    function openModal(photo) {
      currentPhoto = photo;
      currentSlideIndex = 0;
      updateModalView();
      document.getElementById('photoModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('photoModal').classList.remove('active');
    }

    function updateModalView() {
      document.getElementById('modalImg').src = currentPhoto.views[currentSlideIndex];
      document.getElementById('modalTitle').textContent = currentPhoto.title;
      document.getElementById('modalExif').textContent = currentPhoto.exif;
      document.getElementById('modalBuyLink').href = currentPhoto.buyUrl;
    }

    function changeSlide(direction) {
      if (!currentPhoto) return;
      currentSlideIndex = (currentSlideIndex + direction + currentPhoto.views.length) % currentPhoto.views.length;
      updateModalView();
    }

    function filterGallery(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGallery(cat);
    }

    function switchPage(page) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      
      if (page === 'gallery') {
        document.getElementById('gallery-section').classList.add('active');
      } else {
        document.getElementById('about-section').classList.add('active');
      }
      event.target.classList.add('active');
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }

    // Navigazione da tastiera nel carosello modal
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('photoModal').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
      if (e.key === 'Escape') closeModal();
    });

    renderGallery();
  </script>
</body>
</html>
