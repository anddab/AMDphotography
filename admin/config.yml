backend:
  name: github
  repo: anddab/AMDphotography  # Inserisci qui il nome esatto del tuo repository
  branch: main

# Cartella del repository dove Sveltia salverà i file caricati
media_folder: "uploads"

# Percorso pubblico utilizzato dall'HTML per visualizzarle
public_folder: "uploads"

# Definizione collezioni
collections:
  - name: "photos"
    label: "Fotografie"
    folder: "content/photos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo Foto", name: "title", widget: "string" }
      - { label: "Immagine Principale (Originale)", name: "image", widget: "image" }
      - { 
          label: "Immagini Mockup / Viste Aggiuntive (es. Quadro in ambiente)", 
          name: "mockups", 
          widget: "list", 
          field: { label: "Immagine Mockup", name: "mockup", widget: "image" },
          required: false
        }
      - { 
          label: "Categoria", 
          name: "category", 
          widget: "select", 
          options: ["paesaggi", "ritratti", "architettura", "street", "notturna"] 
        }
      - { label: "Link Picfair (Acquisto Stampa)", name: "picfair_url", widget: "string", required: false }
      - { label: "Fotocamera", name: "camera", widget: "string", default: "Sony A7 IV" }
      - { label: "Obiettivo", name: "lens", widget: "string", default: "24-70mm f/2.8 GM II" }
      - { label: "Dati EXIF (Diaframma/Tempo/ISO)", name: "exif", widget: "string", default: "f/8.0 | 1/250s | ISO 100" }
      - { label: "Luogo", name: "location", widget: "string", required: false }

  - name: "settings"
    label: "Impostazioni"
    files:
      - file: "content/settings/general.md"
        label: "Impostazioni Sito e Footer"
        name: "general"
        fields:
          - { label: "Nome Sito / Copyright", name: "site_title", widget: "string", default: "AMD Photography" }
          - { label: "Sottotitolo Footer", name: "footer_subtitle", widget: "string", default: "Fine Art & Landscape Photography" }
          - { label: "Email di Contatto", name: "contact_email", widget: "string", required: false }
          - label: "Link Social & Store"
            name: "social_links"
            widget: "list"
            required: false
            fields:
              - { label: "Nome Piattaforma (es. Instagram, Picfair)", name: "name", widget: "string" }
              - { label: "URL Completo (es. https://instagram.com/...)", name: "url", widget: "string" }
